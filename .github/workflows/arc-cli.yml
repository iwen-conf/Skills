name: Arc CLI state and verification regression

on:
  push:
    paths:
      - "tools/arc/**"
      - "tools/arc-verify/**"
      - ".github/workflows/arc-cli.yml"
      - "plugins/arc-policy/lib/arc_policy/hook.py"
      - "plugins/arc-policy/lib/arc_policy/verify.py"
      - "tests/test_arc_policy_arc_db.py"
      - "tests/test_arc_policy_business_graph.py"
      - "tests/test_arc_policy_graph_receipt.py"
  pull_request:
    paths:
      - "tools/arc/**"
      - "tools/arc-verify/**"
      - ".github/workflows/arc-cli.yml"
      - "plugins/arc-policy/lib/arc_policy/hook.py"
      - "plugins/arc-policy/lib/arc_policy/verify.py"
      - "tests/test_arc_policy_arc_db.py"
      - "tests/test_arc_policy_business_graph.py"
      - "tests/test_arc_policy_graph_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - name: Test indexer strict coverage and Arc state engine
        run: |
          go -C tools/arc-idx test -count=1 ./...
          go -C tools/arc test -count=1 ./...
      - name: Install real code-index dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y universal-ctags
          npm install --global @ast-grep/cli@0.51.1
      - name: Build both actual indexing and verification backends plus Arc CLI
        run: |
          mkdir -p "$RUNNER_TEMP/arc-bin"
          go -C tools/arc-idx build -o "$RUNNER_TEMP/arc-bin/arc-idx" .
          go -C tools/arc-verify build -o "$RUNNER_TEMP/arc-bin/arc-verify" .
          go -C tools/arc build -o "$RUNNER_TEMP/arc-bin/arc" .
          "$RUNNER_TEMP/arc-bin/arc" capabilities --json
      - name: Real-backend init and legacy-graph migration smoke
        run: |
          bash tools/arc/smoke.sh "$RUNNER_TEMP/arc-bin" "$GITHUB_WORKSPACE"
      - name: Run verifier's regression tests
        run: go -C tools/arc-verify test -count=1 ./...
  arc-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused plugin test dependencies
        run: python -m pip install pytest 'PyYAML>=6.0.2'
      - name: Test post-edit reconciliation and graph cutover
        env:
          PYTHONPATH: plugins/arc-policy/lib:src
        run: python -m pytest -q tests/test_arc_policy_arc_db.py tests/test_arc_policy_business_graph.py tests/test_arc_policy_graph_receipt.py
