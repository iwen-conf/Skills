name: Arc ETA plan parity

on:
  pull_request:
    paths:
      - 'tools/arc-verify/workbench/**'
      - 'docs/03-执行任务/arc-eta-plan-parity.md'
      - '.github/workflows/arc-eta-parity.yml'
  push:
    branches: [main]
    paths:
      - 'tools/arc-verify/workbench/**'
      - '.github/workflows/arc-eta-parity.yml'

permissions:
  contents: read

jobs:
  plan:
    name: Typecheck, lint, plan tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: tools/arc-verify/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/vp check
      - run: ./node_modules/.bin/vp test run
      - run: bun run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.56.0 Pillow==12.0.0
      - run: python -m py_compile scripts/eta_visual_qa.py scripts/eta_pixel_compare.py
      - run: python -m unittest discover -s scripts -p "test_eta_pixel_compare.py" -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/eta_visual_qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-eta-browser-geometry
          path: tools/arc-verify/workbench/.arc-visual-qa/
          if-no-files-found: warn
