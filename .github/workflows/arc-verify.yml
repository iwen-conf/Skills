name: ARC Verify Go and local Turso
on:
  pull_request:
    paths:
      - 'tools/arc-verify/**'
      - '.github/workflows/arc-verify.yml'
  push:
    branches: [main]
    paths:
      - 'tools/arc-verify/**'
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/arc-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/arc-verify/go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build .
  local-turso:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/arc-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/arc-verify/go.mod
      - name: Install official tursodb shell
        run: |
          curl -fsSL https://github.com/tursodatabase/turso/releases/latest/download/turso_cli-installer.sh -o /tmp/turso_cli-installer.sh
          sh /tmp/turso_cli-installer.sh
          for dir in "$HOME/.local/bin" "$HOME/.turso/bin" "$HOME/.cargo/bin"; do echo "$dir" >> "$GITHUB_PATH"; done
      - name: Verify local Turso engine and business graph integration
        run: |
          command -v tursodb
          go test -race -run TestTursoLocalBusinessChain -count=1 -v ./...
