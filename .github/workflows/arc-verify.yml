name: Arc Verify Go model checks
on:
  pull_request:
    paths:
      - 'tools/arc-verify/**'
      - '.github/workflows/arc-verify.yml'
  push:
    branches: [main]
    paths:
      - 'tools/arc-verify/**'
jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/arc-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/arc-verify/go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build .
