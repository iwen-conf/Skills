<style>
:root {
  --bg: #0b0f14;
  --panel: #0e141b;
  --text: #c9d1d9;
  --head: #e6edf3;
  --dim: #7d8590;
  --faint: #3a4450;
  --cyan: #5ad1e6;
  --blue: #79a8ff;
  --green: #6fdc8c;
  --purple: #b48cff;
  --amber: #e8b25d;
  --orange: #ff9e3d;
  --red: #ff7b72;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 13px/1.55 "JetBrains Mono", "SF Mono", Menlo, "PingFang SC", "Microsoft YaHei", monospace;
  padding: 24px 16px;
}
#fit { margin: 0 auto; overflow: hidden; }
#stage { position: relative; transform-origin: 0 0; }
svg#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.abs { position: absolute; }
.box {
  position: absolute; background: var(--panel);
  border: 1.5px solid var(--c, var(--faint)); padding: 10px 14px;
  transition: background-color .18s ease, box-shadow .18s ease;
}
.box:hover {
  background: color-mix(in srgb, var(--c, var(--faint)) 12%, var(--panel));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c, var(--faint)) 35%, transparent), 0 0 18px color-mix(in srgb, var(--c, var(--faint)) 18%, transparent);
}
.box.dash, .box.is-none, .box.is-off, .box.is-dev { border-style: dashed; }
.box.is-none > :not(.st) { opacity: .6; }
.ttl { text-align: center; font-weight: 700; color: var(--head); }
.sub { text-align: center; color: var(--c); }
.c { text-align: center; }
.dim { color: var(--dim); }
.b { font-weight: 700; }
.w { color: var(--head); }
.cy { color: var(--cyan); } .bl { color: var(--blue); } .gr { color: var(--green); }
.pu { color: var(--purple); } .am { color: var(--amber); } .rd { color: var(--red); }
.tag { display: inline-block; padding: 0 6px; border: 1px solid currentColor; color: var(--c); font-size: 11px; line-height: 17px; }

/* header */
#head { left: 0; right: 0; top: 0; text-align: center; letter-spacing: .5px; }
#head .t { font-weight: 700; color: var(--head); }
#head .rule { border-top: 1px dashed var(--faint); margin: 12px 0 10px; }
.sq { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }
.lg { margin: 0 12px; color: var(--dim); white-space: nowrap; }

/* groups: fieldset-like outline with the legend cutting the border */
.group { position: absolute; border: 1px dashed var(--c, var(--faint)); }
.group.solid { border-style: solid; }
.group .glg { position: absolute; top: -10px; left: 16px; padding: 0 8px; background: var(--bg); color: var(--c); font-size: 12px; line-height: 18px; white-space: nowrap; }
.note { font-size: 12px; }

/* module table */
.mods { margin-top: 8px; width: 100%; border-collapse: collapse; }
.mods td { padding: 0 4px; height: 26px; white-space: nowrap; }
.mods td.n { color: var(--head); }
.mods td.p { color: var(--dim); font-size: 11px; }
.mods td.d { text-align: right; }
.bar { display: inline-block; height: 9px; vertical-align: 0; margin-right: 6px; }
.hr { border-top: 1px dashed var(--faint); margin: 8px 0 6px; }

/* pipeline chips */
.pipe { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px 0 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--c); padding: 2px 7px; color: var(--c); font-size: 12px; white-space: nowrap; }
.chip.q { border-style: dashed; }
.arr { color: var(--dim); }

/* rail: side panel whose items line up with the rows they talk to */
.rail .item { position: absolute; left: 14px; right: 12px; }
.rail .vl { position: absolute; left: 19px; top: 64px; bottom: 20px; border-left: 1px dashed var(--faint); }
.rail .ind { padding-left: 16px; }
.dia { color: var(--c); }
.hl { background: color-mix(in srgb, var(--c) 16%, var(--panel)); margin: 0 -12px 0 -14px; padding: 2px 12px 2px 14px; }

/* status badges sit on the top border */
.st { position: absolute; top: -10px; right: 10px; padding: 0 6px; background: var(--bg);
      font-size: 11px; line-height: 18px; white-space: nowrap; }
.st::before { content: "●"; margin-right: 4px; display: inline-block; }
.st.ok { color: var(--green); } .st.ok::before { animation: pulse 1.6s ease-in-out infinite; }
.st.warn { color: var(--orange); } .st.warn::before { content: "▲"; animation: pulse .8s ease-in-out infinite; }
.st.dev { color: var(--amber); } .st.dev::before { content: "◐"; }
.st.off { color: var(--red); } .st.off::before { content: "■"; }
.st.none { color: var(--dim); } .st.none::before { content: "○"; }
.st.done { color: var(--green); opacity: .75; } .st.done::before { content: "✓"; }
.stl { position: static; background: none; margin: 0 10px; font-size: 12px; }
@keyframes pulse { 50% { opacity: .25; } }

/* log + terminal footer */
#log { border: 1px solid var(--faint); padding: 14px 16px 10px; }
#log .legend { position: absolute; top: -10px; left: 20px; background: var(--bg); padding: 0 8px; color: var(--dim); }
#log .row { display: grid; white-space: nowrap; }
#log .row > span:last-child { overflow: hidden; text-overflow: ellipsis; }
#log .live { overflow: hidden; }
#log .live .row { height: 20px; line-height: 20px; }
#log .row.new { animation: flash 1s ease-out; }
@keyframes flash { from { background: #1d2a1f; } to { background: transparent; } }
.livedot { color: var(--green); animation: pulse 1s ease-in-out infinite; }
.cursor { display: inline-block; width: 9px; height: 15px; background: var(--green); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.flow { animation: flow .6s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }
.lbl { font: 11px "JetBrains Mono", "SF Mono", Menlo, "PingFang SC", "Microsoft YaHei", monospace; }

@media (prefers-reduced-motion: reduce) { .flow, .cursor, .st::before { animation: none !important; } }
.check .flow, .check .cursor, .check .st::before { animation: none !important; }
/* ?loop=4: every CSS period divides 4s so recordings repeat without a seam */
.loop .flow { animation-duration: .5s; }
.loop .cursor { animation-duration: 1s; }
.loop .st.ok::before { animation-duration: 2s; }
.check .box { transition: none; }

/* per-language CJK / Thai fonts (html lang comes from spec.lang) */
html:lang(ja) body, html:lang(ja) .lbl { font-family: "JetBrains Mono", "SF Mono", Menlo, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", monospace; }
html:lang(ko) body, html:lang(ko) .lbl { font-family: "JetBrains Mono", "SF Mono", Menlo, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", monospace; }
html:lang(th) body, html:lang(th) .lbl { font-family: "JetBrains Mono", "SF Mono", Menlo, Thonburi, "Leelawadee UI", "Noto Sans Thai", monospace; }

</style>

    };
    (function tick() {
      const now = svg.getCurrentTime(), due = [];
      timed.forEach((x, i) => {
        while (next[i] <= now) {
          if (logs(next[i], i, x.timing.dur)) due.push([next[i], x]);
          next[i] += x.timing.dur;
        }
      });
      // a background tab catching up only shows the latest rows
      due.sort((p, q) => p[0] - q[0]).slice(-max).forEach(([tt, x]) => add(clock(tt), x, true));
      requestAnimationFrame(tick);
    })();
  }

  (S.edges || []).forEach((e0, i) => {
    const f = FLOW[e0.flow] || {};
    if (e0.flow && !FLOW[e0.flow]) issues.push(`edge#${i}: unknown flow "${e0.flow}"`);
    const e = Object.assign({ color: f.color, dash: f.dash }, e0);
    if (e0.color == null) e.color = f.color;
    if (e0.dash == null) e.dash = f.dash;
    const name = e.id || `edge#${i} ${Array.isArray(e.from) ? 'pt' : e.from}→${Array.isArray(e.to) ? 'pt' : e.to}`;
    let a = anchor(e.from, centerOf(e.to), name), z = anchor(e.to, centerOf(e.from), name);
    if (!a || !z) return;
    // straight: slide the start along its side so the wire runs straight into the target
    if (e.straight) { if (V(a.side)) a.x = z.x; else a.y = z.y; }
    const pts = route(a, z, e).map(p => [Math.round(p[0] * 2) / 2, Math.round(p[1] * 2) / 2]);
    const k = col(e.color || 'dim');
    const p = document.createElementNS(NS, 'polyline');
    p.setAttribute('points', pts.map(q => q.join(',')).join(' '));
    p.setAttribute('fill', 'none'); p.setAttribute('stroke', cssv(k)); p.setAttribute('stroke-width', 1.4);
    if (e.dash) { p.setAttribute('stroke-dasharray', '5 4'); if (!STILL) p.classList.add('flow'); }
    if (e.arrow !== false) { marker(k); p.setAttribute('marker-end', `url(#a-${k})`); }
    if (e.arrow === 'both') p.setAttribute('marker-start', `url(#a-${k})`);
    svg.appendChild(p);
    const timing = !STILL && e.packet !== false ? packet(pts, k) : null;
    if (LIVE) liveEntry(e, k, timing);
    if (e.joint && pts.length > 2) dot(pts[pts.length - 2][0], pts[pts.length - 2][1], k, e.joint === 'hollow');
    if (e.startDot) dot(pts[0][0], pts[0][1], k, e.startDot === 'hollow');
    if (e.label) label(pts, e, k, name);
    for (let j = 1; j < pts.length; j++) segs.push({ name, a: pts[j - 1], b: pts[j], skip: [a.box, z.box] });
  });
  for (const d of S.dots || []) {
    const c = Array.isArray(d.at) ? { x: d.at[0], y: d.at[1] } : anchor(d.at, null, 'dot');
    if (c) dot(c.x, c.y, col(d.color || 'dim'), d.hollow);
  }
  if (LIVE) startLive();

  // ---------- self-check ----------
  const tag = e => e.id ? '#' + e.id : (e.className || e.tagName);
  const solids = [...stage.querySelectorAll('.box, .note, #log, #head, .group > .glg')].map(e => ({ e, r: R(e) }));
  if (!solids.every(s => s.e.id)) solids.filter(s => s.e.classList.contains('glg')).forEach(s => { s.e.id ||= (s.e.parentElement.id || 'group') + '-legend'; });
  const inter = (p, q, pad = 0) => Math.min(p.r, q.r) - Math.max(p.l, q.l) > pad && Math.min(p.b, q.b) - Math.max(p.t, q.t) > pad;
  for (let i = 0; i < solids.length; i++) for (let j = i + 1; j < solids.length; j++) {
    const A = solids[i], B = solids[j];
    if (A.e.contains(B.e) || B.e.contains(A.e)) continue;
    if (inter(A.r, B.r, 2)) issues.push(`overlap: ${tag(A.e)} and ${tag(B.e)}`);
  }
  for (const { e, r } of solids) {
    if (e.classList.contains('box')) {
      if (e.scrollHeight > e.clientHeight + 2) issues.push(`${tag(e)}: content is ${e.scrollHeight - e.clientHeight}px taller than the box — raise h or cut text`);
      if (e.scrollWidth > e.clientWidth + 2) issues.push(`${tag(e)}: content is ${e.scrollWidth - e.clientWidth}px wider than the box — widen it or shorten a line`);
    }
    if (r.l < -1 || r.r > W + 1) issues.push(`${tag(e)}: outside the ${W}px canvas (l=${Math.round(r.l)}, r=${Math.round(r.r)})`);
  }
  for (const rl of rails) {
    const its = rl.items.map((x, i) => ({ i: i + 1, r: R(x.e) })).sort((p, q) => p.r.t - q.r.t);
    for (let i = 1; i < its.length; i++) {
      if (its[i].r.t < its[i - 1].r.b + 4) issues.push(`rail #${rl.n.id}: item ${its[i].i} collides with item ${its[i - 1].i} — move it or set top`);
    }
    const last = its[its.length - 1];
    if (last && last.r.b > R(rl.d).b - 4) issues.push(`rail #${rl.n.id}: items run past the bottom — raise h`);
  }
  const boxes = solids.filter(s => ['box', 'note', 'glg'].some(c => s.e.classList.contains(c)));
  for (const s of segs) {
    const hz = Math.abs(s.a[1] - s.b[1]) < .5;
    const sl = Math.min(s.a[0], s.b[0]), sr = Math.max(s.a[0], s.b[0]), st = Math.min(s.a[1], s.b[1]), sb = Math.max(s.a[1], s.b[1]);
    for (const { e, r } of boxes) {
      if (s.skip.includes(e)) continue;
      const hit = hz ? (s.a[1] > r.t + 2 && s.a[1] < r.b - 2 && sr > r.l + 2 && sl < r.r - 2)
                     : (s.a[0] > r.l + 2 && s.a[0] < r.r - 2 && sb > r.t + 2 && st < r.b - 2);
      if (hit) issues.push(`${s.name}: wire passes through ${tag(e)} — use rail/mid/via to route around it`);
    }
  }
  for (const { t, name } of labels) {
    const b = t.getBBox(), lr = { l: b.x, t: b.y, r: b.x + b.width, b: b.y + b.height };
    for (const { e, r } of solids) if (inter(lr, r, 1)) issues.push(`${name}: label "${t.textContent}" sits on ${tag(e)} — use labelSide/labelOffset`);
    if (lr.l < -1 || lr.r > W + 1) issues.push(`${name}: label "${t.textContent}" leaves the canvas`);
    const hits = new Set();
    for (const s of segs) {
      if (s.name === name) continue;
      const sl = Math.min(s.a[0], s.b[0]), sr = Math.max(s.a[0], s.b[0]), st = Math.min(s.a[1], s.b[1]), sb = Math.max(s.a[1], s.b[1]);
      if (sr > lr.l + 1 && sl < lr.r - 1 && sb > lr.t + 1 && st < lr.b - 1) hits.add(s.name);
    }
    for (const h of hits) issues.push(`${name}: label "${t.textContent}" is crossed by ${h} — use labelSide/labelPos`);
  }
  let crossings = 0;
  for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
    const s = segs[i], u = segs[j];
    if (s.name === u.name) continue;
    const sh = Math.abs(s.a[1] - s.b[1]) < .5, uh = Math.abs(u.a[1] - u.b[1]) < .5;
    if (sh === uh) continue;
    const h = sh ? s : u, v = sh ? u : s;
    const x = v.a[0], y = h.a[1];
    if (x > Math.min(h.a[0], h.b[0]) + 1 && x < Math.max(h.a[0], h.b[0]) - 1 &&
        y > Math.min(v.a[1], v.b[1]) + 1 && y < Math.max(v.a[1], v.b[1]) - 1) crossings++;
  }
  for (const c of badColors) issues.push(`unknown color ${JSON.stringify(c)} — use one of: ${[...COLORS].join(' ')} (or ${Object.keys(SHORT).join(' ')})`);
  if (crossings) warnings.push(`${crossings} wire crossing(s) — fine if unavoidable, but try reordering boxes first`);

  const pre = el('pre', null, null, document.body);
  pre.id = '__diag'; pre.hidden = true;
  pre.textContent = JSON.stringify({ width: W, height: H, issues, warnings });
  if (issues.length) console.warn('[arch-diagram]', issues);

  // ---------- scale to fit narrow screens ----------
  // zoom re-lays out at the smaller size so text stays crisp; transform blurs in narrow windows
  const useZoom = CSS.supports('zoom', '0.5');
  function scale() {
    const k = Math.min(1, fit.clientWidth / W);
    if (useZoom) stage.style.zoom = k; else stage.style.transform = `scale(${k})`;
    fit.style.height = (H * k) + 'px';
  }
  addEventListener('resize', scale); scale();
})();

</script>
</body>
</html>
