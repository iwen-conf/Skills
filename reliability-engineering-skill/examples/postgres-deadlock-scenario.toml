[scenario]
name = "forced-opposite-row-lock-order"
isolation = "read committed"
barrier_timeout_s = 10
statement_timeout_ms = 8000
observe_interval_ms = 25

# This is an intentionally failing database interleaving used to prove the
# harness can observe a 40P01 deadlock. Run only against a disposable DB where
# txn_lab_accounts(id bigint primary key, balance bigint) has rows 1 and 2.

[expect]
require_observer = true
required_sqlstates = ["40P01"]
allowed_sqlstates = ["40P01"]
max_transaction_ms = 10000

[[session]]
name = "A"
steps = [
  { sql = "UPDATE txn_lab_accounts SET balance = balance + 1 WHERE id = 1", signal = "a_has_1" },
  { sql = "UPDATE txn_lab_accounts SET balance = balance - 1 WHERE id = 2", wait_for = ["b_has_2"] },
]

[[session]]
name = "B"
steps = [
  { sql = "UPDATE txn_lab_accounts SET balance = balance + 1 WHERE id = 2", signal = "b_has_2" },
  { sql = "UPDATE txn_lab_accounts SET balance = balance - 1 WHERE id = 1", wait_for = ["a_has_1"] },
]
