# Template only: this skills repository forbids active .github/workflows.
name: ARC Verify Go native Turso performance and correctness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/arc-verify/**'
      - 'tools/arc-verify/ci/github-native-turso.yml'
  push:
    branches: [main]
    paths:
      - 'tools/arc-verify/**'
jobs:
  native-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/arc-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/arc-verify/go.mod
      - name: Resolve pinned native Turso driver
        run: go mod tidy
      - name: Run real local-Turso ledger tests and race checks
        run: go test -race -count=1 ./...
      - name: Static checks
        run: go vet ./...
      - name: Build short-lived CLI
        run: go build -o arc-verify .
      - name: Profile synthetic local graph operations (not business E2E)
        run: |
          set -o pipefail
          go test -run=^BENCHMARK_ONLY_NONE -bench=Benchmark -benchmem -benchtime=100x -count=3 ./... | tee performance-benchmark.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-verify-perf-results
          path: tools/arc-verify/performance-benchmark.txt
          if-no-files-found: ignore
